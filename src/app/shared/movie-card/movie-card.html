<article class="movie-card">

  <img
    class="movie-poster"
    [src]="movie().imagen"
    [alt]="movie().nombre"
  />

  <div class="movie-info">

    <h3>{{ movie().nombre }}</h3>

    <p class="movie-details">
      {{ movie().edadMinima? '+' + movie().edadMinima : 'ATP'}} · {{ movie().duracion }} min · {{ movie().generos.join(', ') }}
    </p>

    <p class="movie-synopsis">
      {{ movie().sinopsis }}
    </p>

    <button type="button">
      Ver funciones
    </button>

  </div>

</article>
