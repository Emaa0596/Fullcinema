<header class="main-header">
  <div class="logo">
    <a routerLink="/home">
      FullCinema
    </a>
  </div>

  <nav class="main-nav">
    <a routerLink="/home" routerLinkActive="active">
      Inicio
    </a>

    <a routerLink="/movies" routerLinkActive="active">
      Cartelera
    </a>

    <a routerLink="/coming-soon" routerLinkActive="active">
      Próximamente
    </a>
  </nav>

  <div class="auth-actions">
    @if (auth.session()){
    <span class="user-email">
      {{ auth.session()?.user?.email }}
    </span>

    <button type="button" (click)="auth.logout()">
      Cerrar sesión
    </button>
    } @else {

    <a routerLink="/login" routerLinkActive="active">
      Ingresar
    </a>

    <a routerLink="/register" routerLinkActive="active" class="register-button">
      Registrarse
    </a>
    }

  </div>
</header>
