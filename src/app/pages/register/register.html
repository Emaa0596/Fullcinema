<section class="register">

  <h1>Crear cuenta</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <label>
      Nombre
      <input type="text" formControlName="nombre">
    </label>

    <label>
      Apellido
      <input type="text" formControlName="apellido">
    </label>

    <label>
      Fecha de nacimiento
      <input type="date" formControlName="nacimiento">
    </label>

    <label>
      Email
      <input type="email" formControlName="email">
    </label>

    <label>
      Contraseña
      <input type="password" formControlName="password">
    </label>

    <label>
      Tipo de sangre
      <input type="text" formControlName="tipoDeSangre">
    </label>

    <label>
      Color de ojos
      <input type="text" formControlName="colorDeOjos">
    </label>

    <label>
      Días de vacaciones
      <input type="number" formControlName="vacaciones">
    </label>

    <button type="submit">
      Registrarse
    </button>

  </form>

</section>
